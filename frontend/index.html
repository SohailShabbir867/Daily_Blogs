<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>
      Daily Blogs - Your Source for Tech Insights & Development Tutorials
    </title>
    <meta
      name="description"
      content="Daily Blogs is a platform for developers to explore articles on web development, programming, design, and technology. Learn, share, and grow with our community."
    />
    <meta
      name="keywords"
      content="web development, programming, javascript, react, tutorials, tech blog, coding, developer, software engineering"
    />
    <meta name="author" content="Daily Blogs Team" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Daily Blogs - Your Source for Tech Insights"
    />
    <meta
      property="og:description"
      content="Explore articles on web development, programming, design, and technology. Learn, share, and grow with our community."
    />
    <meta property="og:site_name" content="Daily Blogs" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Daily Blogs - Your Source for Tech Insights"
    />
    <meta
      name="twitter:description"
      content="Explore articles on web development, programming, design, and technology."
    />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dailyblogs.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
