# Render deployment configuration for Daily Blogs backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: daily-blogs-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these manually in the Render dashboard (never commit real values):
      # MONGODB_URI, SESSION_SECRET, COOKIE_SECRET, CORS_ORIGIN,
      # SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS,
      # SUPER_ADMIN_EMAIL, CHAT_ENCRYPTION_KEY, BCRYPT_SALT_ROUNDS, SESSION_MAX_AGE
